spring:
  datasource:
    url: jdbc:h2:mem:lanka_hms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test_secret_for_h2_profile_needs_to_be_long_enough_for_hmac_sha_test_environment_only
    expiration: 86400000
